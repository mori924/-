# Fly.io — `fly launch --no-deploy` 後に `fly secrets set ANTHROPIC_API_KEY=sk-...` → `fly deploy`
app = "es-tailor"
primary_region = "nrt"   # 東京

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
